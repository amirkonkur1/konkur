<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پلنر هفتگی پیشرفته</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="container header-content">
            <div class="logo">
                <i class="ri-calendar-schedule-line"></i>
                <h1>پلنر هوشمند</h1>
            </div>
            <div class="week-nav">
                <button id="prevWeek"><i class="ri-arrow-right-s-line"></i></button>
                <span id="currentWeekLabel">...</span>
                <button id="nextWeek"><i class="ri-arrow-left-s-line"></i></button>
                <button id="todayBtn" class="btn-primary">امروز</button>
            </div>
            <div class="actions">
                <button onclick="openModal('teacherModal')" class="btn-outline"><i class="ri-user-add-line"></i> استاد جدید</button>
                <button onclick="openModal('classModal')" class="btn-outline"><i class="ri-book-open-line"></i> کلاس جدید</button>
                <button onclick="openModal('taskModal')" class="btn-primary"><i class="ri-add-line"></i> تسک جدید</button>
            </div>
        </div>
    </header>

    <!-- Main Grid -->
    <main class="container main-grid" id="weeklyGrid">
        <!-- Days will be injected here via JS -->
    </main>

    <!-- Modals -->

    <!-- 1. Add Teacher Modal -->
    <div id="teacherModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>افزودن استاد جدید</h3>
                <button class="close-modal">&times;</button>
            </div>
            <form id="teacherForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label>نام استاد</label>
                    <input type="text" name="name" required placeholder="مثلا: دکتر حسینی">
                </div>
                <div class="form-group">
                    <label>درس تخصصی</label>
                    <input type="text" name="subject_name" required placeholder="مثلا: ریاضیات گسسته">
                </div>
                <div class="form-group">
                    <label>رنگ نمایشی</label>
                    <input type="color" name="color" value="#6C63FF">
                </div>
                <div class="form-group">
                    <label>عکس استاد</label>
                    <input type="file" name="photo" accept="image/*">
                </div>
                <button type="submit" class="btn-submit">ذخیره استاد</button>
            </form>
        </div>
    </div>

    <!-- 2. Add Class (Schedule) Modal -->
    <div id="classModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>ثبت کلاس در برنامه هفتگی</h3>
                <button class="close-modal">&times;</button>
            </div>
            <form id="scheduleForm">
                <div class="form-group">
                    <label>انتخاب استاد</label>
                    <select id="teacherSelect" name="teacher_id" required></select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>روز هفته</label>
                        <select name="day_of_week" required>
                            <option value="شنبه">شنبه</option>
                            <option value="یکشنبه">یکشنبه</option>
                            <option value="دوشنبه">دوشنبه</option>
                            <option value="سه‌شنبه">سه‌شنبه</option>
                            <option value="چهارشنبه">چهارشنبه</option>
                            <option value="پنجشنبه">پنجشنبه</option>
                            <option value="جمعه">جمعه</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>مکان</label>
                        <input type="text" name="location" placeholder="کلاس ۱۰۲">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>ساعت شروع</label>
                        <input type="time" name="start_time" required>
                    </div>
                    <div class="form-group">
                        <label>ساعت پایان</label>
                        <input type="time" name="end_time" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit">ثبت کلاس</button>
            </form>
        </div>
    </div>

    <!-- 3. Add Task Modal -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>افزودن فعالیت مطالعاتی</h3>
                <button class="close-modal">&times;</button>
            </div>
            <form id="taskForm">
                <div class="form-group">
                    <label>عنوان فعالیت</label>
                    <input type="text" id="taskTitle" required placeholder="مثلا: مرور فصل ۳ فیزیک">
                </div>
                <div class="form-group">
                    <label>نوع فعالیت</label>
                    <select id="taskType" class="type-select">
                        <option value="مرور">🔄 مرور درس</option>
                        <option value="حل نمونه سوال">✍️ حل نمونه سوال</option>
                        <option value="نوشتن جزوه">📝 نوشتن جزوه</option>
                        <option value="مطالعه کتاب">📖 مطالعه کتاب</option>
                        <option value="آزمون">📋 آزمون آزمایشی</option>
                        <option value="سایر">📌 سایر</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>تاریخ انجام (شمسی)</label>
                        <input type="text" id="taskDate" placeholder="1403/08/12" required>
                        <small style="color:#aaa">فرمت: YYYY/MM/DD</small>
                    </div>
                    <div class="form-group">
                        <label>اولویت</label>
                        <select id="taskPriority">
                            <option value="کم">کم</option>
                            <option value="متوسط" selected>متوسط</option>
                            <option value="زیاد">زیاد</option>
                            <option value="بحرانی">بحرانی</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>توضیحات</label>
                    <textarea id="taskDesc" rows="3"></textarea>
                </div>
                <button type="submit" class="btn-submit">ذخیره فعالیت</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
