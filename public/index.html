<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پلنر هوشمند دانش‌آموز</title>
    <!-- فونت وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <!-- آیکون‌های RemixIcon -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- پس‌زمینه متحرک -->
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- نوار ابزار اصلی -->
    <header class="glass-header">
        <div class="container header-content">
            <div class="brand">
                <div class="logo-box">
                    <i class="ri-rocket-2-fill"></i>
                </div>
                <div>
                    <h1>پلنر هوشمند</h1>
                    <span class="subtitle">مدیریت زمان تحصیلی</span>
                </div>
            </div>

            <div class="week-controller glass-panel">
                <button id="prevWeek" class="icon-btn"><i class="ri-arrow-right-s-line"></i></button>
                <div class="date-display">
                    <i class="ri-calendar-event-line"></i>
                    <span id="currentWeekLabel">...</span>
                </div>
                <button id="nextWeek" class="icon-btn"><i class="ri-arrow-left-s-line"></i></button>
            </div>

            <div class="actions">
                <button onclick="openModal('teacherModal')" class="btn btn-secondary">
                    <i class="ri-user-star-line"></i> <span>استاد</span>
                </button>
                <button onclick="openModal('classModal')" class="btn btn-secondary">
                    <i class="ri-book-mark-line"></i> <span>کلاس</span>
                </button>
                <button onclick="openModal('taskModal')" class="btn btn-primary glow">
                    <i class="ri-add-circle-line"></i> <span>تسک جدید</span>
                </button>
            </div>
        </div>
    </header>

    <!-- شبکه هفتگی -->
    <main class="container main-grid" id="weeklyGrid">
        <!-- ستون‌ها توسط جاوااسکریپت پر می‌شوند -->
    </main>

    <!-- ─── مودال‌ها (با افکت شیشه‌ای) ─── -->

    <!-- 1. افزودن استاد -->
    <div id="teacherModal" class="modal-wrapper">
        <div class="modal-backdrop"></div>
        <div class="modal-glass">
            <div class="modal-header">
                <h3><i class="ri-user-add-line"></i> افزودن استاد جدید</h3>
                <button class="close-modal"><i class="ri-close-line"></i></button>
            </div>
            <form id="teacherForm" enctype="multipart/form-data">
                <div class="input-group">
                    <label>نام استاد</label>
                    <input type="text" name="name" required placeholder="مثلا: دکتر حسابی">
                </div>
                <div class="input-group">
                    <label>درس تخصصی</label>
                    <input type="text" name="subject_name" required placeholder="مثلا: فیزیک کوانتوم">
                </div>
                <div class="row-group">
                    <div class="input-group">
                        <label>رنگ سازمانی</label>
                        <input type="color" name="color" value="#6C63FF">
                    </div>
                    <div class="input-group">
                        <label>عکس پرسنلی</label>
                        <div class="file-upload">
                            <input type="file" name="photo" accept="image/*" id="teacherPhoto">
                            <label for="teacherPhoto"><i class="ri-image-add-line"></i> انتخاب عکس</label>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn-submit">ثبت استاد</button>
            </form>
        </div>
    </div>

    <!-- 2. ثبت کلاس -->
    <div id="classModal" class="modal-wrapper">
        <div class="modal-backdrop"></div>
        <div class="modal-glass">
            <div class="modal-header">
                <h3><i class="ri-timeline-view"></i> تنظیم برنامه کلاسی</h3>
                <button class="close-modal"><i class="ri-close-line"></i></button>
            </div>
            <form id="scheduleForm">
                <div class="input-group">
                    <label>انتخاب استاد</label>
                    <select id="teacherSelect" name="teacher_id" required></select>
                </div>
                <div class="row-group">
                    <div class="input-group">
                        <label>روز هفته</label>
                        <select name="day_of_week" required>
                            <option value="شنبه">شنبه</option>
                            <option value="یکشنبه">یکشنبه</option>
                            <option value="دوشنبه">دوشنبه</option>
                            <option value="سه‌شنبه">سه‌شنبه</option>
                            <option value="چهارشنبه">چهارشنبه</option>
                            <option value="پنجشنبه">پنجشنبه</option>
                            <option value="جمعه">جمعه</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>مکان کلاس</label>
                        <input type="text" name="location" placeholder="ساختمان A - کلاس ۱۲">
                    </div>
                </div>
                <div class="row-group">
                    <div class="input-group">
                        <label>شروع</label>
                        <input type="time" name="start_time" required>
                    </div>
                    <div class="input-group">
                        <label>پایان</label>
                        <input type="time" name="end_time" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit">ثبت در برنامه</button>
            </form>
        </div>
    </div>

    <!-- 3. افزودن تسک -->
    <div id="taskModal" class="modal-wrapper">
        <div class="modal-backdrop"></div>
        <div class="modal-glass">
            <div class="modal-header">
                <h3><i class="ri-focus-3-line"></i> هدف مطالعاتی جدید</h3>
                <button class="close-modal"><i class="ri-close-line"></i></button>
            </div>
            <form id="taskForm">
                <div class="input-group">
                    <label>عنوان فعالیت</label>
                    <input type="text" id="taskTitle" required placeholder="مثلا: مرور فصل ۳ زیست">
                </div>
                
                <div class="type-selector">
                    <label>نوع فعالیت را انتخاب کنید:</label>
                    <div class="types-grid">
                        <label class="type-option">
                            <input type="radio" name="taskType" value="مرور" checked>
                            <span><i class="ri-refresh-line"></i> مرور</span>
                        </label>
                        <label class="type-option">
                            <input type="radio" name="taskType" value="حل نمونه سوال">
                            <span><i class="ri-ball-pen-line"></i> تست/سوال</span>
                        </label>
                        <label class="type-option">
                            <input type="radio" name="taskType" value="نوشتن جزوه">
                            <span><i class="ri-file-text-line"></i> جزوه</span>
                        </label>
                        <label class="type-option">
                            <input type="radio" name="taskType" value="مطالعه کتاب">
                            <span><i class="ri-book-open-line"></i> مطالعه</span>
                        </label>
                        <label class="type-option">
                            <input type="radio" name="taskType" value="آزمون">
                            <span><i class="ri-trophy-line"></i> آزمون</span>
                        </label>
                    </div>
                </div>

                <div class="row-group">
                    <div class="input-group">
                        <label>تاریخ انجام (شمسی)</label>
                        <input type="text" id="taskDate" placeholder="1403/08/12" required>
                    </div>
                    <div class="input-group">
                        <label>اولویت</label>
                        <select id="taskPriority">
                            <option value="کم">🟢 کم</option>
                            <option value="متوسط" selected>🟡 متوسط</option>
                            <option value="زیاد">🟠 زیاد</option>
                            <option value="بحرانی">🔴 بحرانی</option>
                        </select>
                    </div>
                </div>
                
                <button type="submit" class="btn-submit gradient-btn">ذخیره هدف</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
