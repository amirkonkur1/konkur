<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پلنر هوشمند دانش‌آموز</title>
    <!-- فونت -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <!-- آیکون‌ها -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- استایل -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- کتابخانه Moment JS (نسخه کامل شامل Jalaali) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-jalaali/0.9.6/moment-jalaali.js"></script>
</head>
<body>

    <!-- پس‌زمینه -->
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- هدر -->
    <header class="glass-header">
        <div class="container header-content">
            <div class="brand">
                <div class="logo-box"><i class="ri-rocket-2-fill"></i></div>
                <div><h1>پلنر هوشمند</h1><span class="subtitle">مدیریت زمان</span></div>
            </div>

            <div class="week-controller glass-panel">
                <button id="prevWeek" class="icon-btn"><i class="ri-arrow-right-s-line"></i></button>
                <div class="date-display">
                    <i class="ri-calendar-event-line"></i>
                    <span id="currentWeekLabel">...</span>
                </div>
                <button id="nextWeek" class="icon-btn"><i class="ri-arrow-left-s-line"></i></button>
            </div>

            <div class="actions">
                <button onclick="openModal('teacherModal')" class="btn btn-secondary"><i class="ri-user-star-line"></i> استاد</button>
                <button onclick="openModal('classModal')" class="btn btn-secondary"><i class="ri-book-mark-line"></i> کلاس</button>
                <button onclick="openModal('taskModal')" class="btn btn-primary glow"><i class="ri-add-circle-line"></i> تسک</button>
            </div>
        </div>
    </header>

    <!-- گرید اصلی -->
    <main class="container main-grid" id="weeklyGrid">
        <!-- توسط JS پر می‌شود -->
    </main>

    <!-- مودال‌ها (همان کدهای قبلی) -->
    <!-- ... کدهای مودال teacherModal, classModal, taskModal بدون تغییر ... -->
    <!-- فقط مطمئن شوید ID ها دقیقاً مثل قبل باشند -->
    
    <div id="teacherModal" class="modal-wrapper">
        <div class="modal-backdrop"></div>
        <div class="modal-glass">
            <div class="modal-header"><h3>افزودن استاد</h3><button class="close-modal"><i class="ri-close-line"></i></button></div>
            <form id="teacherForm" enctype="multipart/form-data">
                <div class="input-group"><label>نام</label><input type="text" name="name" required></div>
                <div class="input-group"><label>درس</label><input type="text" name="subject_name" required></div>
                <div class="row-group">
                    <div class="input-group"><label>رنگ</label><input type="color" name="color" value="#6C63FF"></div>
                    <div class="input-group"><label>عکس</label><div class="file-upload"><input type="file" name="photo" accept="image/*" id="tPhoto"><label for="tPhoto">انتخاب</label></div></div>
                </div>
                <button type="submit" class="btn-submit">ثبت</button>
            </form>
        </div>
    </div>

    <div id="classModal" class="modal-wrapper">
        <div class="modal-backdrop"></div>
        <div class="modal-glass">
            <div class="modal-header"><h3>ثبت کلاس</h3><button class="close-modal"><i class="ri-close-line"></i></button></div>
            <form id="scheduleForm">
                <div class="input-group"><label>استاد</label><select id="teacherSelect" name="teacher_id" required></select></div>
                <div class="row-group">
                    <div class="input-group"><label>روز</label><select name="day_of_week" required><option value="شنبه">شنبه</option><option value="یکشنبه">یکشنبه</option><option value="دوشنبه">دوشنبه</option><option value="سه‌شنبه">سه‌شنبه</option><option value="چهارشنبه">چهارشنبه</option><option value="پنجشنبه">پنجشنبه</option><option value="جمعه">جمعه</option></select></div>
                    <div class="input-group"><label>مکان</label><input type="text" name="location"></div>
                </div>
                <div class="row-group">
                    <div class="input-group"><label>شروع</label><input type="time" name="start_time" required></div>
                    <div class="input-group"><label>پایان</label><input type="time" name="end_time" required></div>
                </div>
                <button type="submit" class="btn-submit">ثبت</button>
            </form>
        </div>
    </div>

    <div id="taskModal" class="modal-wrapper">
        <div class="modal-backdrop"></div>
        <div class="modal-glass">
            <div class="modal-header"><h3>فعالیت جدید</h3><button class="close-modal"><i class="ri-close-line"></i></button></div>
            <form id="taskForm">
                <div class="input-group"><label>عنوان</label><input type="text" id="taskTitle" required></div>
                <div class="type-selector">
                    <label>نوع:</label>
                    <div class="types-grid">
                        <label class="type-option"><input type="radio" name="taskType" value="مرور" checked><span>مرور</span></label>
                        <label class="type-option"><input type="radio" name="taskType" value="تست"><span>تست</span></label>
                        <label class="type-option"><input type="radio" name="taskType" value="جزوه"><span>جزوه</span></label>
                        <label class="type-option"><input type="radio" name="taskType" value="مطالعه"><span>مطالعه</span></label>
                    </div>
                </div>
                <div class="row-group">
                    <div class="input-group"><label>تاریخ (1403/01/01)</label><input type="text" id="taskDate" required></div>
                    <div class="input-group"><label>اولویت</label><select id="taskPriority"><option value="کم">کم</option><option value="متوسط">متوسط</option><option value="زیاد">زیاد</option></select></div>
                </div>
                <button type="submit" class="btn-submit">ذخیره</button>
            </form>
        </div>
    </div>

    <!-- اسکریپت اصلی -->
    <script src="js/app.js"></script>
</body>
</html>
